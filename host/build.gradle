// snd-host: the permanent side — agent entry, Byte Buddy hooks, Prism (JNA),
// dev HTTP server, module loader. The jar is a FAT agent jar (core + Byte Buddy
// + JNA merged in) so `-javaagent:host-all.jar` is self-contained and the same
// jar sits on the classpath.
def gameJar = "${gameDir}/dice.jar"

dependencies {
    implementation project(':core')
    implementation 'net.bytebuddy:byte-buddy:1.15.10'
    implementation 'net.java.dev.jna:jna:5.14.0'
    compileOnly files(gameJar)
}
compileJava.options.release = 8
// javac on the 21 toolchain calls release 8 obsolete; the game's bundled
// OpenJ9 1.8 JRE fixes the target, so the [options] lint is noise here.
compileJava.options.compilerArgs << '-Xlint:-options'

jar {
    archiveBaseName = 'snd-host-all'
    manifest {
        attributes(
            'Premain-Class': 'snd.host.SndAgent',
            'Agent-Class': 'snd.host.SndAgent',
            'Can-Retransform-Classes': 'true',
            'Can-Redefine-Classes': 'true',
            'Multi-Release': 'true'
        )
    }
    from({ configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/*/module-info.class', 'module-info.class'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
