// snd-module: the reloadable side. The jar holds the module classes AND core's
// (one reloadable unit, one classloader per generation); contracts and the
// game resolve through the parent loaders at runtime, which is what keeps
// contract type identity stable across reloads — contracts classes must never
// be merged in here. Entry class is fixed by convention: snd.module.SndModule.
def gameJar = "${gameDir}/dice.jar"

dependencies {
    implementation project(':contracts')
    implementation project(':core')
    compileOnly files(gameJar)
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
compileJava.options.release = 8
// javac on the 21 toolchain calls release 8 obsolete; the game's bundled
// OpenJ9 1.8 JRE fixes the target, so the [options] lint is noise here.
compileJava.options.compilerArgs << '-Xlint:-options'

jar {
    archiveBaseName = 'snd-module'
    // The running mod reads its version from here (ModVersion): the greeting
    // says it and the launch update check compares against it.
    manifest { attributes('Implementation-Title': 'SnDAccess', 'Implementation-Version': modVersion) }
    from project(':core').sourceSets.main.output
}
